name: Build WeaponOverheat
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Quest mod discovery DLL
        run: dotnet build WeaponOverheat.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: WeaponOverheat-discovery-build
          path: bin/Release/net8.0/WeaponOverheat.dll
